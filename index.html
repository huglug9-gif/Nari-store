<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NARI FASHION</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f7;
  color:#222;
}

button{
  cursor:pointer;
  border:none;
}

.navbar{
  background:#111;
  color:white;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:bold;
  letter-spacing:1px;
}

.nav-right{
  display:flex;
  gap:8px;
  align-items:center;
}

.nav-btn{
  background:white;
  color:#111;
  padding:9px 13px;
  border-radius:8px;
  font-weight:bold;
}

.admin-btn{
  background:#e91e63;
  color:white;
}

.hero{
  padding:45px 20px;
  text-align:center;
  background:linear-gradient(135deg,#111,#444);
  color:white;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  font-size:17px;
  opacity:.9;
}

.search-area{
  max-width:850px;
  margin:25px auto;
  padding:0 15px;
}

.search-box{
  width:100%;
  padding:15px 18px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
  background:white;
}

.search-box:focus{
  border-color:#e91e63;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:10px 15px 50px;
}

.section-title{
  margin:15px 0;
  font-size:25px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:18px;
}

.product-card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);
}

.product-card img{
  width:100%;
  height:250px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:13px;
}

.product-name{
  font-weight:bold;
  font-size:17px;
  margin-bottom:7px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin-bottom:9px;
}

.stock{
  font-size:13px;
  margin-bottom:10px;
}

.card-btn{
  width:100%;
  background:#111;
  color:white;
  padding:11px;
  border-radius:8px;
  font-weight:bold;
}

.no-products{
  text-align:center;
  padding:50px 10px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:2000;
  overflow:auto;
  padding:20px;
}

.modal-box{
  background:white;
  max-width:650px;
  margin:40px auto;
  border-radius:15px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  font-size:25px;
  background:none;
}

.detail-img{
  width:100%;
  max-height:430px;
  object-fit:contain;
  border-radius:10px;
  background:#f2f2f2;
}

.detail-name{
  font-size:25px;
  font-weight:bold;
  margin:15px 0 5px;
}

.detail-price{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.size-title{
  font-weight:bold;
  margin:15px 0 8px;
}

.sizes{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.size-btn{
  padding:9px 13px;
  border:1px solid #bbb;
  border-radius:7px;
  background:white;
}

.size-btn.active{
  background:#111;
  color:white;
}

.qty-box{
  display:flex;
  align-items:center;
  gap:15px;
  margin:18px 0;
}

.qty-btn{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#111;
  color:white;
  font-size:20px;
}

.add-cart{
  width:100%;
  padding:14px;
  border-radius:9px;
  background:#e91e63;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.cart-drawer{
  display:none;
  position:fixed;
  right:0;
  top:0;
  height:100%;
  width:min(430px,100%);
  background:white;
  z-index:3000;
  box-shadow:-5px 0 20px rgba(0,0,0,.25);
  overflow:auto;
  padding:20px;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.cart-item img{
  width:70px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
}

.cart-item-info{
  flex:1;
}

.cart-total{
  font-size:22px;
  font-weight:bold;
  margin:18px 0;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:5px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

.place-order{
  width:100%;
  background:#111;
  color:white;
  padding:14px;
  border-radius:9px;
  font-weight:bold;
}

.location-btn{
  width:100%;
  padding:11px;
  background:#eee;
  border-radius:8px;
  margin-bottom:12px;
}

.order-card{
  background:#fafafa;
  border:1px solid #ddd;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.status{
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.statusPending{
  background:#fff3cd;
  color:#856404;
}

.statusProcessing{
  background:#cfe2ff;
  color:#084298;
}

.statusDelivered{
  background:#d1e7dd;
  color:#0f5132;
}

.statusCancelled{
  background:#f8d7da;
  color:#842029;
}

.order-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.order-actions button{
  flex:1;
  padding:9px;
  border-radius:7px;
  font-weight:bold;
}

.view-btn{
  background:#111;
  color:white;
}

.cancel-btn{
  background:#dc3545;
  color:white;
}

.support-btn{
  background:#198754;
  color:white;
}

.info{
  padding:12px;
  background:#f1f1f1;
  border-radius:8px;
  margin:10px 0;
  font-size:14px;
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

@media(max-width:600px){

  .logo{
    font-size:19px;
  }

  .nav-btn{
    padding:7px 9px;
    font-size:12px;
  }

  .hero h1{
    font-size:30px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-card img{
    height:200px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header class="navbar">

  <div class="logo">
    NARI FASHION
  </div>

  <div class="nav-right">

    <button class="nav-btn" id="cartBtn">
      🛒 Cart <span id="cartCount">0</span>
    </button>

    <button class="nav-btn" id="myOrdersBtn">
      📦 My Orders
    </button>

    <a href="admin.html" class="nav-btn admin-btn">
      Admin
    </a>

  </div>

</header>


<section class="hero">

  <h1>NARI FASHION</h1>

  <p>Fashion that makes you feel confident.</p>

</section>


<div class="search-area">

  <input
    id="search"
    class="search-box"
    type="search"
    placeholder="🔍 Search products..."
    autocomplete="off"
  >

</div>


<main class="container">

  <h2 class="section-title">
    Our Products
  </h2>

  <div id="products" class="products"></div>

  <div id="noProducts" class="no-products" style="display:none;">
    No products found.
  </div>

</main>


<!-- PRODUCT DETAIL -->

<div class="modal" id="productModal">

  <div class="modal-box">

    <button class="close" onclick="closeModal('productModal')">
      ×
    </button>

    <img id="detailImg" class="detail-img">

    <div id="detailName" class="detail-name"></div>

    <div id="detailPrice" class="detail-price"></div>

    <div id="detailStock"></div>

    <div class="size-title">
      Select Size
    </div>

    <div id="sizes" class="sizes"></div>

    <div class="qty-box">

      <button class="qty-btn" onclick="changeDetailQty(-1)">
        −
      </button>

      <strong id="detailQty">1</strong>

      <button class="qty-btn" onclick="changeDetailQty(1)">
        +
      </button>

    </div>

    <button class="add-cart" onclick="addToCart()">
      Add To Cart
    </button>

  </div>

</div>


<!-- CART -->

<div class="cart-drawer" id="cartDrawer">

  <div class="cart-header">

    <h2>Your Cart</h2>

    <button class="close" onclick="closeCart()">
      ×
    </button>

  </div>

  <div id="cartItems"></div>

  <div class="cart-total">
    Total: ₹<span id="cartTotal">0</span>
  </div>


  <div class="form-group">

    <label>Name</label>

    <input
      id="customerName"
      type="text"
      placeholder="Your name"
    >

  </div>


  <div class="form-group">

    <label>Phone</label>

    <input
      id="customerPhone"
      type="tel"
      maxlength="10"
      placeholder="10 digit mobile number"
    >

  </div>


  <div class="form-group">

    <label>Address</label>

    <textarea
      id="customerAddress"
      rows="3"
      placeholder="Full delivery address"
    ></textarea>

  </div>


  <button
    class="location-btn"
    onclick="getLocation()"
  >
    📍 Use Current Location
  </button>

  <div
    id="locationInfo"
    class="info"
    style="display:none;"
  ></div>


  <div class="form-group">

    <label>Payment</label>

    <select id="paymentMethod">

      <option value="COD">
        Cash on Delivery
      </option>

    </select>

  </div>


  <button
    class="place-order"
    onclick="placeOrder()"
  >
    🛍️ Place Order
  </button>

</div>


<!-- MY ORDERS -->

<div class="modal" id="ordersModal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('ordersModal')"
    >
      ×
    </button>

    <h2>📦 My Orders</h2>

    <div class="info">
      Your orders are automatically linked to this device.
    </div>

    <button
      class="place-order"
      onclick="loadMyOrders()"
      style="margin-bottom:15px;"
    >
      🔄 Refresh Orders
    </button>

    <div id="myOrdersList"></div>

  </div>

</div>


<!-- ORDER DETAIL -->

<div class="modal" id="orderDetailModal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('orderDetailModal')"
    >
      ×
    </button>

    <h2>Order Details</h2>

    <div id="orderDetailContent"></div>

  </div>

</div>


<!-- SUPPORT -->

<div class="modal" id="supportModal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('supportModal')"
    >
      ×
    </button>

    <h2>📞 Customer Support</h2>

    <div class="form-group">

      <label>Subject</label>

      <input
        id="supportSubject"
        placeholder="Problem with order"
      >

    </div>

    <div class="form-group">

      <label>Message</label>

      <textarea
        id="supportMessage"
        rows="5"
        placeholder="Describe your problem..."
      ></textarea>

    </div>

    <button
      class="place-order"
      onclick="submitSupport()"
    >
      Send Complaint
    </button>

  </div>

</div>


<footer>

  <p>© 2026 NARI FASHION</p>

  <p style="margin-top:6px;">
    Fashion • Quality • Style
  </p>

</footer>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

  apiKey:
    "AIzaSyAqyKD4uqDvEy7n_pnGrpY02C-NToqVRb8",

  authDomain:
    "nari-fashion-947a7.firebaseapp.com",

  projectId:
    "nari-fashion-947a7",

  storageBucket:
    "nari-fashion-947a7.firebasestorage.app",

  messagingSenderId:
    "529668256601",

  appId:
    "1:529668256601:web:b3cc39c8ea7c783133d248",

  measurementId:
    "G-6QLMB312CM"

};


firebase.initializeApp(firebaseConfig);


const db =
  firebase.firestore();

const auth =
  firebase.auth();


let currentUser = null;

let products = [];

let cart = [];

let selectedProduct = null;

let selectedSize = "";

let detailQty = 1;

let currentLocation = null;

let selectedOrderId = null;


/* =========================================
   CUSTOMER ANONYMOUS AUTH
========================================= */

auth.onAuthStateChanged(function(user){

  if(user){

    currentUser = user;

    console.log(
      "Customer UID:",
      user.uid
    );

    load();

  }

});


auth.signInAnonymously()
.catch(function(error){

  console.error(
    "Anonymous login failed:",
    error
  );

  alert(
    "Customer login start nahi ho pa raha. Firebase Authentication me Anonymous enable karo."
  );

});


/* =========================================
   PRODUCTS
========================================= */

async function load(){

  try{

    const snap =
      await db
      .collection("products")
      .get();

    products =
      snap.docs.map(function(doc){

        return {
          id:doc.id,
          ...doc.data()
        };

      });

    render(products);

  }catch(error){

    console.error(error);

    document.getElementById("products").innerHTML =
      "<p>Products load nahi ho paaye.</p>";

  }

}


function getSizes(product){

  let result = [];

  if(Array.isArray(product.sizes)){

    result =
      result.concat(product.sizes);

  }else if(product.sizes){

    result =
      result.concat(
        String(product.sizes)
        .split(",")
      );

  }

  if(Array.isArray(product.inchSizes)){

    result =
      result.concat(product.inchSizes);

  }else if(product.inchSizes){

    result =
      result.concat(
        String(product.inchSizes)
        .split(",")
      );

  }

  return [
    ...new Set(
      result
      .map(function(x){
        return String(x).trim();
      })
      .filter(Boolean)
    )
  ];

}


function render(list){

  const container =
    document.getElementById("products");

  const noProducts =
    document.getElementById("noProducts");


  container.innerHTML = "";


  if(!list.length){

    noProducts.style.display =
      "block";

    return;

  }


  noProducts.style.display =
    "none";


  list.forEach(function(product){

    const card =
      document.createElement("div");

    card.className =
      "product-card";


    const image =
      product.image ||
      product.imageUrl ||
      "https://via.placeholder.com/500x600?text=NARI+FASHION";


    const price =
      Number(product.price || 0);


    const stock =
      Number(product.stock ?? 0);


    card.innerHTML = `

      <img
        src="${escapeHtml(image)}"
        alt="${escapeHtml(product.name || "Product")}"
        loading="lazy"
        onerror="this.src='https://via.placeholder.com/500x600?text=Image+Not+Found'"
      >

      <div class="product-info">

        <div class="product-name">
          ${escapeHtml(product.name || "Unnamed Product")}
        </div>

        <div class="price">
          ₹${price}
        </div>

        <div class="stock">
          ${
            stock > 0
            ? "✅ In Stock: " + stock
            : "❌ Out of Stock"
          }
        </div>

        <button
          class="card-btn"
          onclick="openProduct('${product.id}')"
          ${stock <= 0 ? "disabled" : ""}
        >
          View Product
        </button>

      </div>
    `;


    container.appendChild(card);

  });

}


/* =========================================
   SEARCH
========================================= */

document
.getElementById("search")
.addEventListener("input", function(e){

  const query =
    e.target.value
    .trim()
    .toLowerCase();


  if(!query){

    render(products);

    return;

  }


  const filtered =
    products.filter(function(product){

      const name =
        String(product.name || "")
        .toLowerCase();

      const category =
        String(product.category || "")
        .toLowerCase();

      const description =
        String(product.description || "")
        .toLowerCase();

      const sizes =
        getSizes(product)
        .join(" ")
        .toLowerCase();


      return (
        name.includes(query) ||
        category.includes(query) ||
        description.includes(query) ||
        sizes.includes(query)
      );

    });


  render(filtered);

});


/* =========================================
   PRODUCT DETAIL
========================================= */

function openProduct(id){

  selectedProduct =
    products.find(function(p){
      return p.id === id;
    });


  if(!selectedProduct)
    return;


  detailQty = 1;

  selectedSize = "";


  document.getElementById("detailImg").src =
    selectedProduct.image ||
    selectedProduct.imageUrl ||
    "https://via.placeholder.com/500x600";


  document.getElementById("detailName").innerText =
    selectedProduct.name || "";


  document.getElementById("detailPrice").innerText =
    "₹" + Number(selectedProduct.price || 0);


  document.getElementById("detailStock").innerText =
    "Stock: " +
    Number(selectedProduct.stock || 0);


  document.getElementById("detailQty").innerText =
    detailQty;


  const sizes =
    document.getElementById("sizes");


  sizes.innerHTML = "";


  const sizeList =
    getSizes(selectedProduct);


  if(!sizeList.length){

    selectedSize = "Standard";

    sizes.innerHTML =
      "<span>Standard</span>";

  }else{

    sizeList.forEach(function(size){

      const button =
        document.createElement("button");

      button.className =
        "size-btn";

      button.innerText =
        size;

      button.onclick =
        function(){

          document
          .querySelectorAll(".size-btn")
          .forEach(function(btn){
            btn.classList.remove("active");
          });

          button.classList.add("active");

          selectedSize = size;

        };


      sizes.appendChild(button);

    });

  }


  document.getElementById("productModal")
  .style.display = "block";

}


function changeDetailQty(amount){

  if(!selectedProduct)
    return;


  const stock =
    Number(selectedProduct.stock || 0);


  detailQty += amount;


  if(detailQty < 1)
    detailQty = 1;


  if(detailQty > stock)
    detailQty = stock;


  document.getElementById("detailQty")
  .innerText = detailQty;

}


function addToCart(){

  if(!selectedProduct)
    return;


  const stock =
    Number(selectedProduct.stock || 0);


  if(stock <= 0){

    alert("Product out of stock.");

    return;

  }


  if(!selectedSize){

    const sizes =
      getSizes(selectedProduct);

    selectedSize =
      sizes.length
      ? sizes[0]
      : "Standard";

  }


  const existing =
    cart.find(function(item){

      return (
        item.productId === selectedProduct.id &&
        item.size === selectedSize
      );

    });


  if(existing){

    existing.qty += detailQty;

  }else{

    cart.push({

      productId:
        selectedProduct.id,

      name:
        selectedProduct.name || "",

      price:
        Number(selectedProduct.price || 0),

      image:
        selectedProduct.image ||
        selectedProduct.imageUrl ||
        "",

      size:
        selectedSize,

      qty:
        detailQty

    });

  }


  saveCart();

  closeModal("productModal");

  updateCartCount();

  alert("Product cart me add ho gaya.");

}


function saveCart(){

  localStorage.setItem(
    "nariFashionCart",
    JSON.stringify(cart)
  );

}


function loadCart(){

  try{

    cart =
      JSON.parse(
        localStorage.getItem("nariFashionCart")
      ) || [];

  }catch(e){

    cart = [];

  }

  updateCartCount();

}


function updateCartCount(){

  const count =
    cart.reduce(function(total,item){

      return total + Number(item.qty || 0);

    },0);


  document.getElementById("cartCount")
  .innerText = count;

}


/* =========================================
   CART
========================================= */

document
.getElementById("cartBtn")
.addEventListener("click", openCart);


function openCart(){

  renderCart();

  document.getElementById("cartDrawer")
  .style.display = "block";

}


function closeCart(){

  document.getElementById("cartDrawer")
  .style.display = "none";

}


function renderCart(){

  const box =
    document.getElementById("cartItems");

  box.innerHTML = "";


  if(!cart.length){

    box.innerHTML =
      "<p>Your cart is empty.</p>";

    document.getElementById("cartTotal")
    .innerText = "0";

    return;

  }


  let total = 0;


  cart.forEach(function(item,index){

    const itemTotal =
      Number(item.price) *
      Number(item.qty);


    total += itemTotal;


    const div =
      document.createElement("div");

    div.className =
      "cart-item";


    div.innerHTML = `

      <img
        src="${escapeHtml(item.image || "https://via.placeholder.com/100")}"
      >

      <div class="cart-item-info">

        <strong>
          ${escapeHtml(item.name)}
        </strong>

        <div>
          ₹${item.price}
        </div>

        <div>
          Size: ${escapeHtml(item.size)}
        </div>

        <div>
          Qty: ${item.qty}
        </div>

        <button
          onclick="removeCartItem(${index})"
          style="
            margin-top:6px;
            background:#dc3545;
            color:white;
            padding:6px 9px;
            border-radius:6px;
          "
        >

  });

}


function removeCartItem(index){

  cart.splice(index,1);

  saveCart();

  updateCartCount();

  renderCart();

}


/* =========================================
   LOCATION
========================================= */

function getLocation(){

  if(!navigator.geolocation){

    alert("Location support available nahi hai.");

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      currentLocation = {

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude

      };


      const info =
        document.getElementById("locationInfo");


      info.style.display =
        "block";


      info.innerHTML =
        "📍 Location captured successfully.";

    },

    function(error){

      console.error(error);

      alert(
        "Location nahi mil paayi. Browser me location permission allow karo."
      );

    }

  );

}


/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder(){

  if(!currentUser){

    alert(
      "Customer account ready nahi hua. Thoda wait karke try karo."
    );

    return;

  }


  if(!cart.length){

    alert("Cart empty hai.");

    return;

  }


  const name =
    document.getElementById("customerName")
    .value.trim();


  const phone =
    document.getElementById("customerPhone")
    .value.trim();


  const address =
    document.getElementById("customerAddress")
    .value.trim();


  const paymentMethod =
    document.getElementById("paymentMethod")
    .value;


  if(!name){

    alert("Name enter karo.");

    return;

  }


  if(!/^[0-9]{10}$/.test(phone)){

    alert(
      "Valid 10 digit mobile number enter karo."
    );

    return;

  }


  if(!address){

    alert("Delivery address enter karo.");

    return;

  }


  const total =
    cart.reduce(function(sum,item){

      return (
        sum +
        Number(item.price || 0) *
        Number(item.qty || 0)
      );

    },0);


  const order = {

    customerUid:
      currentUser.uid,

    customerName:
      name,

    customerPhone:
      phone,

    customerAddress:
      address,

    location:
      currentLocation || null,

    paymentMethod:
      paymentMethod,

    items:
      cart.map(function(item){

        return {

          productId:
            item.productId,

          name:
            item.name,

          price:
            Number(item.price),

          size:
            item.size,

          qty:
            Number(item.qty),

          image:
            item.image || ""

        };

      }),

    total:
      total,

    status:
      "pending",

    createdAt:
      firebase.firestore.FieldValue.serverTimestamp()

  };


  try{

    const ref =
      await db
      .collection("orders")
      .add(order);


    cart = [];

    saveCart();

    updateCartCount();

    renderCart();


    document.getElementById("customerName")
    .value = "";

    document.getElementById("customerPhone")
    .value = "";

    document.getElementById("customerAddress")
    .value = "";


    currentLocation = null;


    alert(
      "✅ Order successfully placed!\n\nOrder ID: " +
      ref.id
    );


    closeCart();

  }catch(error){

    console.error(error);

    alert(
      "❌ Order place nahi hua.\n\n" +
      error.message
    );

  }

}


/* =========================================
   MY ORDERS
========================================= */

document
.getElementById("myOrdersBtn")
.addEventListener("click", function(){

  document.getElementById("ordersModal")
  .style.display = "block";

  loadMyOrders();

});


async function loadMyOrders(){

  const box =
    document.getElementById("myOrdersList");


  box.innerHTML =
    "<p>Loading orders...</p>";


  if(!currentUser){

    box.innerHTML =
      "<p>Customer account ready nahi hua.</p>";

    return;

  }


  try{

    /*
      IMPORTANT:
      Phone number se search nahi kar rahe.
      Sirf current Firebase anonymous UID ke
      orders fetch honge.
    */

    const snap =
      await db
      .collection("orders")
      .where(
        "customerUid",
        "==",
        currentUser.uid
      )
      .get();


    if(snap.empty){

      box.innerHTML =
        "<div class='info'>Abhi koi order nahi mila.</div>";

      return;

    }


    const orders =
      snap.docs.map(function(doc){

        return {
          id:doc.id,
          ...doc.data()
        };

      });


    orders.sort(function(a,b){

      const at =
        a.createdAt &&
        a.createdAt.toMillis
        ? a.createdAt.toMillis()
        : 0;

      const bt =
        b.createdAt &&
        b.createdAt.toMillis
        ? b.createdAt.toMillis()
        : 0;

      return bt - at;

    });


    box.innerHTML = "";


    orders.forEach(function(order){

      const card =
        document.createElement("div");

      card.className =
        "order-card";


      const status =
        order.status || "pending";


      const statusClass =
        "status" +
        status.charAt(0).toUpperCase() +
        status.slice(1);


      const date =
        formatDate(order.createdAt);


      card.innerHTML = `

        <div class="order-top">

          <div>

            <strong>
              Order #${escapeHtml(order.id.slice(-8))}
            </strong>

            <div style="margin-top:5px;">
              ${date}
            </div>

          </div>

          <span class="status ${statusClass}">
            ${escapeHtml(status.toUpperCase())}
          </span>

        </div>


        <div style="margin-top:10px;">
          Total:
          <strong>
            ₹${Number(order.total || 0)}
          </strong>
        </div>


        <div style="margin-top:5px;">
          Items:
          ${Array.isArray(order.items)
            ? order.items.length
            : 0}
        </div>


        <div class="order-actions">

          <button
            class="view-btn"
            onclick="viewOrder('${order.id}')"
          >
            View
          </button>

          ${
            canCancelOrder(order)
            ?
            `
            <button
              class="cancel-btn"
              onclick="cancelOrder('${order.id}')"
            >
              Cancel
            </button>
            `
            :
            ""
          }

          <button
            class="support-btn"
            onclick="openSupport('${order.id}')"
          >
            Support
          </button>

        </div>

      `;


      box.appendChild(card);

    });

  }catch(error){

    console.error(error);

    box.innerHTML = `

      <div class="info">

        ❌ Orders load nahi ho paaye.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

}


/* =========================================
   ORDER CANCEL
========================================= */

function canCancelOrder(order){

  if(!order)
    return false;


  if(
    order.status === "delivered" ||
    order.status === "cancelled"
  ){

    return false;

  }


  if(!order.createdAt)
    return true;


  const created =
    order.createdAt.toMillis
    ? order.createdAt.toMillis()
    : 0;


  if(!created)
    return true;


  const age =
    Date.now() - created;


  return (
    age <=
    48 * 60 * 60 * 1000
  );

}


async function cancelOrder(id){

  if(!currentUser){

    alert("Customer account ready nahi hai.");

    return;

  }


  const ok =
    confirm(
      "Kya aap is order ko cancel karna chahte ho?"
    );


  if(!ok)
    return;


  try{

    const ref =
      db.collection("orders").doc(id);


    const snap =
      await ref.get();


    if(!snap.exists){

      alert("Order nahi mila.");

      return;

    }


    const order =
      snap.data();


    if(
      order.customerUid !==
      currentUser.uid
    ){

      alert(
        "Aap is order ko cancel nahi kar sakte."
      );

      return;

    }


    if(!canCancelOrder(order)){

      alert(
        "Ye order ab cancel nahi kiya ja sakta."
      );

      return;

    }


    await ref.update({

      status:
        "cancelled",

      cancelledAt:
        firebase.firestore.FieldValue
        .serverTimestamp(),

      cancelledBy:
        "customer"

    });


    alert(
      "✅ Order cancel ho gaya."
    );


    loadMyOrders();

  }catch(error){

    console.error(error);

    alert(
      "❌ Order cancel nahi hua.\n\n" +
      error.message
    );

  }

}

      );

        ${escapeHtml(order.customerPhone || "")}

        <br><br>

    console.error(error);

    alert(
      "Order details load nahi ho paaye."
    );

/* =========================================

========================================= */

function openSupport(orderId){

  selectedOrderId =
    orderId || null;


  document.getElementById("supportSubject")
  .value =
    orderId
    ? "Support for Order " + orderId
    : "";


  document.getElementById("supportMessage")
  .value = "";


  document.getElementById("supportModal")
  .style.display = "block";

}


async function submitSupport(){

  if(!currentUser){

    alert("Customer account ready nahi hai.");

    return;

  }


  const subject =
    document.getElementById("supportSubject")
    .value.trim();


  const message =
    document.getElementById("supportMessage")
    .value.trim();


  if(!subject){

    alert("Subject enter karo.");

    return;

  }


  if(!message){

    alert("Message enter karo.");

    return;

  }


  try{

    await db
    .collection("supportTickets")
    .add({

      customerUid:
        currentUser.uid,

      orderId:
        selectedOrderId || null,

      subject:
        subject,

      message:
        message,

      status:
        "open",

      createdAt:
        firebase.firestore
        .FieldValue
        .serverTimestamp()

    });


    alert(
      "✅ Complaint successfully send ho gayi."
    );


    closeModal("supportModal");

  }catch(error){

    console.error(error);

    alert(
      "❌ Complaint send nahi hui.\n\n" +
      error.message
    );

  }

}


/* =========================================
   UTILITIES
========================================= */

function closeModal(id){

  document.getElementById(id)
  .style.display = "none";

}


function formatDate(timestamp){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "Date unavailable";

  }


  return timestamp
    .toDate()
    .toLocaleString("en-IN");

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
