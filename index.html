<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARI FASHION</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script></head><body><header><div class="logo">NARI FASHION</div><a href="admin.html" class="admin">Admin</a></header><main><section class="hero"><h1>Fashion for Every Style</h1><p>Latest products • Easy ordering • Fast support</p></section><div class="tools"><input id="search" placeholder="Product search..."><button id="cartBtn">Cart (<span id="cartCount">0</span>)</button></div><section id="products" class="grid"><p>Loading products...</p></section></main><div id="cart" class="drawer hidden"><div class="drawerHead"><h2>Your Cart</h2><button id="closeCart">×</button></div><div id="cartItems"></div><div class="checkout"><input id="custName" placeholder="Your name"><input id="custPhone" placeholder="Mobile number"><input id="custAddress" placeholder="Address"><button id="placeOrder">Place Order</button><div id="orderMsg"></div></div></div><script>
const firebaseConfig={apiKey:"AIzaSyAqyKD4uqDvEy7n_pnGrpY02C-NToqVRb8",authDomain:"nari-fashion-947a7.firebaseapp.com",projectId:"nari-fashion-947a7",storageBucket:"nari-fashion-947a7.firebasestorage.app",messagingSenderId:"529668256601",appId:"1:529668256601:web:b3cc39c8ea7c783133d248"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore(); let products=[],cart=[]; const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const s=await db.collection('products').get();products=s.docs.map(d=>({id:d.id,...d.data()}));render(products)}catch(e){console.error(e);$('products').innerHTML='<p>Products load nahi hue. Firebase connection/rules check karein.</p>'}}
function render(list){$('products').innerHTML=list.length?list.map(p=>`<article class="card"><img src="${p.image||'https://placehold.co/600x600?text=NARI+FASHION'}"><div class="cardBody"><h3>${esc(p.name||'Product')}</h3><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><div class="stock">${Number(p.stock||0)>0?'In stock':'Out of stock'}</div><button class="add" ${Number(p.stock||0)<=0?'disabled':''} data-id="${p.id}">Add to Cart</button></div></article>`).join(''):'<p>No products added yet.</p>';document.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(b.dataset.id))}
function add(id){const p=products.find(x=>x.id===id);if(!p||Number(p.stock||0)<=0)return;const x=cart.find(i=>i.id===id);if(x)x.qty++;else cart.push({id,name:p.name,price:Number(p.price||0),qty:1});updateCart()}
function updateCart(){$('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0);$('cartItems').innerHTML=cart.map(i=>`<div>${esc(i.name)} × ${i.qty} — ₹${(i.price*i.qty).toLocaleString('en-IN')}</div>`).join('')||'<p>Cart empty.</p>'}
$('cartBtn').onclick=()=>$('cart').classList.remove('hidden');$('closeCart').onclick=()=>$('cart').classList.add('hidden');$('search').oninput=e=>render(products.filter(p=>String(p.name||'').toLowerCase().includes(e.target.value.toLowerCase())));
$('placeOrder').onclick=async()=>{const name=$('custName').value.trim(),phone=$('custPhone').value.trim(),address=$('custAddress').value.trim();if(!name||!phone||!address||!cart.length)return $('orderMsg').textContent='Name, mobile, address aur cart zaroori hai.';const total=cart.reduce((a,b)=>a+b.price*b.qty,0);try{await db.collection('orders').add({customerName:name,customerPhone:phone,address,items:cart,total,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});$('orderMsg').textContent='Order placed successfully!';cart=[];updateCart()}catch(e){console.error(e);$('orderMsg').textContent='Order place nahi hua: '+e.message}};load();
</script></body></html>
