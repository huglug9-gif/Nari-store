<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NARI FASHION</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f7;
  color:#222;
}

button{
  cursor:pointer;
  border:none;
}

.navbar{
  background:#111;
  color:white;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:bold;
  letter-spacing:1px;
}

.nav-right{
  display:flex;
  gap:8px;
  align-items:center;
}

.nav-btn{
  background:white;
  color:#111;
  padding:9px 13px;
  border-radius:8px;
  font-weight:bold;
}

.admin-btn{
  background:#e91e63;
  color:white;
}

.hero{
  padding:45px 20px;
  text-align:center;
  background:linear-gradient(135deg,#111,#444);
  color:white;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  font-size:17px;
  opacity:.9;
}

.search-area{
  max-width:850px;
  margin:25px auto;
  padding:0 15px;
}

.search-box{
  width:100%;
  padding:15px 18px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
  background:white;
}

.search-box:focus{
  border-color:#e91e63;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:10px 15px 50px;
}

.section-title{
  margin:15px 0;
  font-size:25px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:18px;
}

.product-card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);
}

.product-card img{
  width:100%;
  height:250px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:13px;
}

.product-name{
  font-weight:bold;
  font-size:17px;
  margin-bottom:7px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin-bottom:9px;
}

.stock{
  font-size:13px;
  margin-bottom:10px;
}

.card-btn{
  width:100%;
  background:#111;
  color:white;
  padding:11px;
  border-radius:8px;
  font-weight:bold;
}

.card-btn:disabled{
  background:#999;
  cursor:not-allowed;
}

.no-products{
  text-align:center;
  padding:50px 10px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:2000;
  overflow:auto;
  padding:20px;
}

.modal-box{
  background:white;
  max-width:650px;
  margin:40px auto;
  border-radius:15px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  font-size:25px;
  background:none;
}

.detail-img{
  width:100%;
  max-height:430px;
  object-fit:contain;
  border-radius:10px;
  background:#f2f2f2;
}

.detail-name{
  font-size:25px;
  font-weight:bold;
  margin:15px 0 5px;
}

.detail-price{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.size-title{
  font-weight:bold;
  margin:15px 0 8px;
}

.sizes{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.size-btn{
  padding:9px 13px;
  border:1px solid #bbb;
  border-radius:7px;
  background:white;
}

.size-btn.active{
  background:#111;
  color:white;
}

.qty-box{
  display:flex;
  align-items:center;
  gap:15px;
  margin:18px 0;
}

.qty-btn{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#111;
  color:white;
  font-size:20px;
}

.add-cart{
  width:100%;
  padding:14px;
  border-radius:9px;
  background:#e91e63;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.cart-drawer{
  display:none;
  position:fixed;
  right:0;
  top:0;
  height:100%;
  width:min(430px,100%);
  background:white;
  z-index:3000;
  box-shadow:-5px 0 20px rgba(0,0,0,.25);
  overflow:auto;
  padding:20px;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.cart-item img{
  width:70px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
}

.cart-item-info{
  flex:1;
}

.cart-total{
  font-size:22px;
  font-weight:bold;
  margin:18px 0;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:5px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

.place-order{
  width:100%;
  background:#111;
  color:white;
  padding:14px;
  border-radius:9px;
  font-weight:bold;
}

.location-btn{
  width:100%;
  padding:12px;
  background:#eee;
  border-radius:8px;
  margin-bottom:8px;
  font-weight:bold;
}

.location-btn.success{
  background:#d1e7dd;
  color:#0f5132;
}

.location-btn.loading{
  background:#fff3cd;
  color:#856404;
}

.location-info{
  padding:10px;
  background:#f1f1f1;
  border-radius:8px;
  margin-bottom:12px;
  font-size:13px;
  line-height:1.5;
}

.order-card{
  background:#fafafa;
  border:1px solid #ddd;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.status{
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.statusPending{
  background:#fff3cd;
  color:#856404;
}

.statusProcessing{
  background:#cfe2ff;
  color:#084298;
}

.statusDelivered{
  background:#d1e7dd;
  color:#0f5132;
}

.statusCancelled{
  background:#f8d7da;
  color:#842029;
}

.order-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.order-actions button{
  flex:1;
  min-width:100px;
  padding:9px;
  border-radius:7px;
  font-weight:bold;
}

.view-btn{
  background:#111;
  color:white;
}

.cancel-btn{
  background:#dc3545;
  color:white;
}

.support-btn{
  background:#198754;
  color:white;
}

.map-btn{
  display:inline-block;
  margin-top:10px;
  padding:9px 12px;
  border-radius:7px;
  background:#198754;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.info{
  padding:12px;
  background:#f1f1f1;
  border-radius:8px;
  margin:10px 0;
  font-size:14px;
}

.order-items{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #ddd;
}

.order-item-line{
  padding:5px 0;
  font-size:14px;
}

footer{
  background:#111;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

@media(max-width:600px){

  .navbar{
    padding:12px 10px;
  }

  .logo{
    font-size:19px;
  }

  .nav-right{
    gap:4px;
  }

  .nav-btn{
    padding:7px 8px;
    font-size:11px;
  }

  .admin-btn{
    display:none;
  }

  .hero h1{
    font-size:30px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-card img{
    height:200px;
  }

  .product-name{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

  .modal{
    padding:10px;
  }

  .modal-box{
    margin:20px auto;
    padding:15px;
  }
}
</style>
</head>

<body>

<header class="navbar">

  <div class="logo">
    NARI FASHION
  </div>

  <div class="nav-right">

    <button class="nav-btn" id="cartBtn">
      🛒 Cart <span id="cartCount">0</span>
    </button>

    <button class="nav-btn" id="myOrdersBtn">
      📦 My Orders
    </button>

    <a href="admin.html" class="nav-btn admin-btn">
      Admin
    </a>

  </div>

</header>


<section class="hero">

  <h1>NARI FASHION</h1>

  <p>Fashion that makes you feel confident.</p>

</section>


<div class="search-area">

  <input
    id="search"
    class="search-box"
    type="search"
    placeholder="🔍 Search products..."

<main class="container">

  <h2 class="section-title">

<!-- PRODUCT DETAIL -->

    <div class="size-title">
      Select Size
    </div>

    <div id="sizes" class="sizes"></div>

    <div class="qty-box">

      <button class="qty-btn" onclick="changeDetailQty(-1)">
        −

      <strong id="detailQty">1</strong>

      <button class="qty-btn" onclick="changeDetailQty(1)">

    </div>

    <button class="add-cart" onclick="addToCart()">

</div>


<!-- CART -->

<div class="cart-drawer" id="cartDrawer">

  <div class="cart-header">

    <h2>Your Cart</h2>

    <button class="close" onclick="closeCart()">
      ×

  <div class="form-group">

    <label>Name</label>

    <input
      id="customerName"
      type="text"

  <div class="form-group">

    <input

</div>


<!-- ORDER DETAIL -->

<div class="modal" id="orderDetailModal">

      onclick="closeModal('orderDetailModal')"

      ×

    <h2>Order Details</h2>

</div>


<!-- SUPPORT -->

<div class="modal" id="supportModal">

      ×

<footer>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {

  apiKey:
    "AIzaSyAqyKD4uqDvEy7n_pnGrpY02C-NToqVRb8",

  authDomain:
    "nari-fashion-947a7.firebaseapp.com",

  projectId:
    "nari-fashion-947a7",

  storageBucket:
    "nari-fashion-947a7.firebasestorage.app",

  messagingSenderId:
    "529668256601",

  appId:
    "1:529668256601:web:b3cc39c8ea7c783133d248",

  measurementId:
    "G-6QLMB312CM"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null;
let products = [];
let cart = [];
let selectedProduct = null;
let selectedSize = "";
let detailQty = 1;
let currentLocation = null;
let selectedOrderId = null;


/* =========================================
   AUTH
========================================= */

auth.onAuthStateChanged(function(user){

  if(user){

    currentUser = user;

    console.log(
      "Customer UID:",
      user.uid
    );

    load();

  }

});


auth.signInAnonymously()
.catch(function(error){

  console.error(
    "Anonymous login failed:",
    error
  );

  alert(
    "Customer login start nahi ho pa raha. Firebase Authentication me Anonymous enable karo."
  );

});


/* =========================================
   PRODUCTS
========================================= */

async function load(){

  try{

    const snap =
      await db
      .collection("products")
      .get();

    products =
      snap.docs.map(function(doc){

        return {
          id:doc.id,
          ...doc.data()
        };

      });

    render(products);

  }catch(error){

    console.error(error);

    document.getElementById("products").innerHTML =
      "<p>Products load nahi ho paaye.</p>";

  }

}


function getSizes(product){

  let result = [];

  if(Array.isArray(product.sizes)){

    result = result.concat(product.sizes);

  }else if(product.sizes){

    result = result.concat(
      String(product.sizes).split(",")
    );

  }

  if(Array.isArray(product.inchSizes)){

    result = result.concat(product.inchSizes);

  }else if(product.inchSizes){

    result = result.concat(
      String(product.inchSizes).split(",")
    );

  }

  return [
    ...new Set(
      result
      .map(function(x){
        return String(x).trim();
      })
      .filter(Boolean)
    )
  ];

}


function render(list){

  const container =
    document.getElementById("products");

  const noProducts =
    document.getElementById("noProducts");

  container.innerHTML = "";

  if(!list.length){

    noProducts.style.display = "block";

    return;

  }

  noProducts.style.display = "none";

  list.forEach(function(product){

    const card =
      document.createElement("div");

    card.className = "product-card";

    const image =
      product.image ||
      product.imageUrl ||
      "https://via.placeholder.com/500x600?text=NARI+FASHION";

    const price =
      Number(product.price || 0);

    const stock =
      Number(product.stock ?? 0);

    card.innerHTML = `

      <img
        src="${escapeHtml(image)}"
        alt="${escapeHtml(product.name || "Product")}"
        loading="lazy"
        onerror="this.src='https://via.placeholder.com/500x600?text=Image+Not+Found'"
      >

      <div class="product-info">

        <div class="product-name">
          ${escapeHtml(product.name || "Unnamed Product")}
        </div>

        <div class="price">
          ₹${price}
        </div>

        <div class="stock">
          ${
            stock > 0
            ? "✅ In Stock: " + stock
            : "❌ Out of Stock"
          }
        </div>

        <button
          class="card-btn"
          onclick="openProduct('${product.id}')"
          ${stock <= 0 ? "disabled" : ""}
        >
          View Product
        </button>

      </div>
    `;

    container.appendChild(card);

  });

}


/* =========================================
   SEARCH
========================================= */

document
.getElementById("search")
.addEventListener("input", function(e){

  const query =
    e.target.value
    .trim()
    .toLowerCase();

  if(!query){

    render(products);

    return;

  }

  const filtered =
    products.filter(function(product){

      const name =
        String(product.name || "")
        .toLowerCase();

      const category =
        String(product.category || "")
        .toLowerCase();

      const description =
        String(product.description || "")
        .toLowerCase();

      const sizes =
        getSizes(product)
        .join(" ")
        .toLowerCase();

      return (
        name.includes(query) ||
        category.includes(query) ||
        description.includes(query) ||
        sizes.includes(query)
      );

    });

  render(filtered);

});


/* =========================================
   PRODUCT DETAIL
========================================= */

function openProduct(id){

  selectedProduct =
    products.find(function(p){
      return p.id === id;
    });

  if(!selectedProduct)
    return;

  detailQty = 1;
  selectedSize = "";

  document.getElementById("detailImg").src =
    selectedProduct.image ||
    selectedProduct.imageUrl ||
    "https://via.placeholder.com/500x600";

  document.getElementById("detailName").innerText =
    selectedProduct.name || "";

  document.getElementById("detailPrice").innerText =
    "₹" + Number(selectedProduct.price || 0);

  document.getElementById("detailStock").innerText =
    "Stock: " +
    Number(selectedProduct.stock || 0);

  document.getElementById("detailQty").innerText =
    detailQty;

  const sizes =
    document.getElementById("sizes");

  sizes.innerHTML = "";

  const sizeList =
    getSizes(selectedProduct);

  if(!sizeList.length){

    selectedSize = "Standard";

    sizes.innerHTML =
      "<span>Standard</span>";

  }else{

    sizeList.forEach(function(size){

      const button =
        document.createElement("button");

      button.className = "size-btn";

      button.innerText = size;

      button.onclick = function(){

        document
        .querySelectorAll(".size-btn")
        .forEach(function(btn){
          btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedSize = size;

      };

      sizes.appendChild(button);

    });

  }

  document.getElementById("productModal")
  .style.display = "block";

}


function changeDetailQty(amount){

  if(!selectedProduct)
    return;

  const stock =
    Number(selectedProduct.stock || 0);

  detailQty += amount;

  if(detailQty < 1)
    detailQty = 1;

  if(detailQty > stock)
    detailQty = stock;

  document.getElementById("detailQty")
  .innerText = detailQty;

}


function addToCart(){

  if(!selectedProduct)
    return;

  const stock =
    Number(selectedProduct.stock || 0);

  if(stock <= 0){

    alert("Product out of stock.");

    return;

  }

  if(!selectedSize){

    const sizes =
      getSizes(selectedProduct);

    selectedSize =
      sizes.length
      ? sizes[0]
      : "Standard";

  }

  const existing =
    cart.find(function(item){

      return (
        item.productId === selectedProduct.id &&
        item.size === selectedSize
      );

    });

  if(existing){

    if(existing.qty + detailQty > stock){

      alert(
        "Itni quantity stock me available nahi hai."
      );

      return;

    }

    existing.qty += detailQty;

  }else{

    cart.push({

      productId:
        selectedProduct.id,

      name:
        selectedProduct.name || "",

      price:
        Number(selectedProduct.price || 0),

      image:
        selectedProduct.image ||
        selectedProduct.imageUrl ||
        "",

      size:
        selectedSize,

      qty:
        detailQty

    });

  }

  saveCart();

  closeModal("productModal");

  updateCartCount();

  alert("Product cart me add ho gaya.");

}


/* =========================================
   CART
========================================= */

function saveCart(){

  localStorage.setItem(
    "nariFashionCart",
    JSON.stringify(cart)
  );

}


function loadCart(){

  try{

    cart =
      JSON.parse(
        localStorage.getItem("nariFashionCart")
      ) || [];

  }catch(e){

    cart = [];

  }

  updateCartCount();

}


function updateCartCount(){

  const count =
    cart.reduce(function(total,item){

      return total + Number(item.qty || 0);

    },0);

  document.getElementById("cartCount")
  .innerText = count;

}


document
.getElementById("cartBtn")
.addEventListener("click", openCart);


function openCart(){

  renderCart();

  document.getElementById("cartDrawer")
  .style.display = "block";

}


function closeCart(){

  document.getElementById("cartDrawer")
  .style.display = "none";

}


function renderCart(){

  const box =
    document.getElementById("cartItems");

  box.innerHTML = "";

  if(!cart.length){

    box.innerHTML =
      "<p>Your cart is empty.</p>";

    document.getElementById("cartTotal")
    .innerText = "0";

    return;

  }

  let total = 0;

  cart.forEach(function(item,index){

    const itemTotal =
      Number(item.price || 0) *
      Number(item.qty || 0);

    total += itemTotal;

    const div =
      document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <img
        src="${escapeHtml(item.image || "https://via.placeholder.com/100")}"
        onerror="this.src='https://via.placeholder.com/100'"
      >

      <div class="cart-item-info">

        <strong>
          ${escapeHtml(item.name)}
        </strong>

        <div style="margin-top:4px;">
          Size: ${escapeHtml(item.size)}
        </div>

        <div style="margin-top:4px;">
          ₹${Number(item.price || 0)}
        </div>

        <div style="margin-top:7px;display:flex;align-items:center;gap:7px;">

          <button
            onclick="changeCartQty(${index},-1)"
            style="width:28px;height:28px;border-radius:5px;background:#111;color:white;"
          >
            −
          </button>

          <strong>
            ${Number(item.qty || 0)}
          </strong>

          <button
            onclick="changeCartQty(${index},1)"
            style="width:28px;height:28px;border-radius:5px;background:#111;color:white;"
          >
            +
          </button>

          <button
            onclick="removeCartItem(${index})"
            style="margin-left:auto;background:#dc3545;color:white;padding:6px 9px;border-radius:5px;"
          >
            Remove
          </button>

        </div>

      </div>

    `;

    box.appendChild(div);

  });

  document.getElementById("cartTotal")
  .innerText = total;

}


function changeCartQty(index,amount){

  if(!cart[index])
    return;

  const product =
    products.find(function(p){
      return p.id === cart[index].productId;
    });

  const stock =
    product
    ? Number(product.stock || 0)
    : 999999;

  const newQty =
    Number(cart[index].qty || 0) + amount;

  if(newQty < 1){

    removeCartItem(index);

    return;

  }

  if(newQty > stock){

    alert(
      "Itni quantity stock me available nahi hai."
    );

    return;

  }

  cart[index].qty = newQty;

  saveCart();

  renderCart();

  updateCartCount();

}


function removeCartItem(index){

  cart.splice(index,1);

  saveCart();

  renderCart();

  updateCartCount();

}


/* =========================================
   LOCATION
========================================= */

function getLocation(){

  const button =
    document.getElementById("locationBtn");

  const info =
    document.getElementById("locationInfo");

  if(!navigator.geolocation){

    alert(
      "Is device/browser me location support nahi hai."
    );

    return;

  }

  button.disabled = true;

  button.classList.remove("success");

  button.classList.add("loading");

  button.innerText =
    "📍 Getting Location...";

  info.style.display = "block";

  info.innerText =
    "Please location permission me Allow dabao...";

  navigator.geolocation.getCurrentPosition(

    function(position){

      const latitude =
        Number(position.coords.latitude);

      const longitude =
        Number(position.coords.longitude);

      if(
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
      ){

        currentLocation = null;

        button.disabled = false;

        button.classList.remove("loading");

        button.innerText =
          "📍 Share Current Location";

        info.innerText =
          "❌ Valid location nahi mili.";

        return;

      }

      /*
        IMPORTANT:
        Firestore me plain object save hoga.
        Admin isi format ko read karega.
      */

      currentLocation = {

        latitude: latitude,

        longitude: longitude

      };

      button.disabled = false;

      button.classList.remove("loading");

      button.classList.add("success");

      button.innerText =
        "✅ Location Shared";

      info.innerHTML =

        "📍 <strong>Location successfully shared</strong><br>" +

        "Latitude: " +
        latitude.toFixed(6) +
        "<br>" +

        "Longitude: " +
        longitude.toFixed(6);

    },

    function(error){

      console.error(
        "Location error:",
        error
      );

      currentLocation = null;

      button.disabled = false;

      button.classList.remove("loading");
      button.classList.remove("success");

      button.innerText =
        "📍 Share Current Location";

      info.style.display = "block";

      if(error.code === 1){

        info.innerText =
          "❌ Location permission denied. Browser settings me location permission Allow karo.";

      }else if(error.code === 2){

        info.innerText =
          "❌ Location available nahi hai. GPS/Location ON karo.";

      }else if(error.code === 3){

        info.innerText =
          "❌ Location lene me time lag gaya. Dobara try karo.";

      }else{

        info.innerText =
          "❌ Location nahi mil payi. Dobara try karo.";

      }

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder(){

  if(!currentUser){

    alert(
      "Customer login abhi ready nahi hai. Thoda wait karke dobara try karo."
    );

    return;

  }

  if(!cart.length){

    alert("Cart empty hai.");

    return;

  }

  const name =
    document
    .getElementById("customerName")
    .value
    .trim();

  const phone =
    document
    .getElementById("customerPhone")
    .value
    .trim();

  const address =
    document
    .getElementById("customerAddress")
    .value
    .trim();

  const paymentMethod =
    document
    .getElementById("paymentMethod")
    .value;


  if(!name){

    alert("Apna naam enter karo.");

    return;

  }

  if(!/^[0-9]{10}$/.test(phone)){

    alert(
      "10 digit valid mobile number enter karo."
    );

    return;

  }

  if(!address){

    alert("Delivery address enter karo.");

    return;

  }


  /*
    IMPORTANT LOCATION CHECK
    Location ke bina order nahi banega.
  */

  if(!currentLocation){

    alert(
      "📍 Pehle apni current location share karo.\n\n" +
      "Location button dabao aur browser me Allow karo."
    );

    return;

  }


  const button =
    document.querySelector(".place-order");

  button.disabled = true;

  button.innerText =
    "⏳ Placing Order...";


  try{

    /*
      Order items ko clean plain data me convert kar rahe hain.
    */

    const orderItems =
      cart.map(function(item){

        return {

          productId:
            String(item.productId || ""),

          name:
            String(item.name || ""),

          price:
            Number(item.price || 0),

          image:
            String(item.image || ""),

          size:
            String(item.size || "Standard"),

          qty:
            Number(item.qty || 0)

        };

      });


    const total =
      orderItems.reduce(function(sum,item){

        return sum +
          (
            Number(item.price || 0) *
            Number(item.qty || 0)
          );

      },0);


    /*
      IMPORTANT:
      location EXACTLY latitude/longitude object
      ke form me Firebase me save hogi.
    */

    const locationToSave = {

      latitude:
        Number(currentLocation.latitude),

      longitude:
        Number(currentLocation.longitude)

    };


    const orderData = {

      customerUid:
        currentUser.uid,

      customerName:
        name,

      customerPhone:
        phone,

      customerAddress:
        address,

      location:
        locationToSave,

      paymentMethod:
        paymentMethod,

      items:
        orderItems,

      total:
        total,

      status:
        "pending",

      createdAt:
        firebase.firestore
        .FieldValue
        .serverTimestamp()

    };


    const docRef =
      await db
      .collection("orders")
      .add(orderData);


    console.log(
      "Order created:",
      docRef.id,
      orderData
    );


    alert(
      "✅ Order successfully place ho gaya!"
    );


    cart = [];

    saveCart();

    updateCartCount();

    currentLocation = null;

    document.getElementById("customerName")
    .value = "";

    document.getElementById("customerPhone")
    .value = "";

    document.getElementById("customerAddress")
    .value = "";

    document.getElementById("locationInfo")
    .style.display = "none";

    const locationBtn =
      document.getElementById("locationBtn");

    locationBtn.classList.remove("success");
    locationBtn.classList.remove("loading");

    locationBtn.innerText =
      "📍 Share Current Location";

    closeCart();


  }catch(error){

    console.error(
      "Order error:",
      error
    );

    alert(
      "❌ Order place nahi hua.\n\n" +
      error.message
    );

  }finally{

    button.disabled = false;

    button.innerText =
      "🛍️ Place Order";

  }

}


/* =========================================

document
.getElementById("myOrdersBtn")
.addEventListener("click",function(){

  document.getElementById("ordersModal")
  .style.display = "block";

  loadMyOrders();

});


async function loadMyOrders(){

  const box =
    document.getElementById("myOrdersList");

  if(!currentUser){

    box.innerHTML =
      "<p>Customer login ready nahi hai.</p>";

    return;

  }

  box.innerHTML =
    "<p>⏳ Orders loading...</p>";


  try{

    const snap =
      await db
      .collection("orders")
      .where(
        "customerUid",
        "==",
        currentUser.uid
      )
      .get();


    const orders =
      snap.docs.map(function(doc){

        return {

          id:doc.id,

          ...doc.data()

        };

      });


    orders.sort(function(a,b){

      const aTime =
        a.createdAt && a.createdAt.toMillis
        ? a.createdAt.toMillis()
        : 0;

      const bTime =
        b.createdAt && b.createdAt.toMillis
        ? b.createdAt.toMillis()
        : 0;

      return bTime - aTime;

    });


    if(!orders.length){

      box.innerHTML =
        "<p>No orders found.</p>";

      return;

    }


    box.innerHTML = "";


    orders.forEach(function(order){

      const card =
        document.createElement("div");

      card.className =
        "order-card";


      const statusClass =
        getStatusClass(order.status);


      const location =
        getCustomerLocation(order);


      let locationHtml = "";


      if(location){

        const mapUrl =
          "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(
            location.latitude +
            "," +
            location.longitude
          );


        locationHtml = `

          <a
            class="map-btn"
            href="${mapUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            📍 View Order Location
          </a>

        `;

      }


      const itemsCount =
        Array.isArray(order.items)
        ? order.items.reduce(function(sum,item){
            return sum + Number(item.qty || 0);
          },0)
        : 0;


      card.innerHTML = `

        <div class="order-top">

          <div>

            <strong>
              Order #${escapeHtml(order.id.slice(-6).toUpperCase())}
            </strong>

            <div style="font-size:12px;color:#777;margin-top:4px;">
              ${formatDate(order.createdAt)}
            </div>

          </div>

          <span class="status ${statusClass}">
            ${escapeHtml(order.status || "pending")}
          </span>

        </div>


        <div style="margin-top:10px;">
          Items: ${itemsCount}
        </div>

        <div style="margin-top:5px;">
          Total: <strong>₹${Number(order.total || 0)}</strong>
        </div>

        ${locationHtml}


        <div class="order-actions">

          <button
            class="view-btn"
            onclick="viewOrder('${order.id}')"
          >
            View
          </button>

          ${
            order.status !== "cancelled" &&
            order.status !== "delivered"
            ? `
              <button
                class="cancel-btn"
                onclick="cancelOrder('${order.id}')"
              >
                Cancel
              </button>
            `
            : ""
          }

          <button
            class="support-btn"
            onclick="openSupport('${order.id}')"
          >
            Support
          </button>

        </div>

      `;


      box.appendChild(card);

    });


  }catch(error){

    console.error(error);

    box.innerHTML =
      "<p>❌ Orders load nahi ho paaye.<br>" +
      escapeHtml(error.message) +
      "</p>";

  }

}

/* =========================================
   CANCEL ORDER
========================================= */

async function cancelOrder(orderId){

  if(!currentUser)
    return;


  const confirmed =
    confirm(
      "Kya aap is order ko cancel karna chahte ho?"
    );


  if(!confirmed)
    return;


  try{

    const ref =
      db
      .collection("orders")
      .doc(orderId);


    const snap =
      await ref.get();


    if(!snap.exists){

      alert("Order nahi mila.");

      return;

    }


    const order =
      snap.data();


    if(
      order.customerUid !==
      currentUser.uid
    ){

      alert("Aap is order ko cancel nahi kar sakte.");

      return;

    }


    if(
      order.status === "delivered" ||
      order.status === "cancelled"
    ){

      alert(
        "Ye order ab cancel nahi kiya ja sakta."
      );

      return;

    }


    await ref.update({

      status:
        "cancelled",

      cancelledAt:
        firebase.firestore
        .FieldValue
        .serverTimestamp(),

      cancelledBy:
        "customer"

    });


    alert(
      "✅ Order cancel ho gaya."
    );


    loadMyOrders();


  }catch(error){

    console.error(error);

    alert(
      "❌ Order cancel nahi hua.\n\n" +
      error.message
    );

  }

}

/* =========================================
   LOCATION HELPERS
========================================= */

function getCustomerLocation(order){

  if(!order)
    return null;


  const loc =
    order.location;


  if(!loc)
    return null;


  let latitude = null;

  let longitude = null;


  if(
    typeof loc.latitude === "number" &&
    typeof loc.longitude === "number"
  ){

    latitude =
      loc.latitude;

    longitude =
      loc.longitude;

  }else if(
    typeof loc.lat === "number" &&
    typeof loc.lng === "number"
  ){

    latitude =
      loc.lat;

    longitude =
      loc.lng;

  }else if(
    typeof loc._lat === "number" &&
    typeof loc._long === "number"
  ){

    latitude =
      loc._lat;

    longitude =
      loc._long;

  }


  if(
    latitude === null ||
    longitude === null
  ){

    return null;

  }


  if(
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ){

    return null;

  }


  if(
    latitude < -90 ||
    latitude > 90 ||
    longitude < -180 ||
    longitude > 180
  ){

    return null;

  }


  return {

    latitude:
      latitude,

    longitude:
      longitude

  };

}


/* =========================================
   STATUS
========================================= */

function getStatusClass(status){

  switch(
    String(status || "")
    .toLowerCase()
  ){

    case "processing":
      return "statusProcessing";

    case "delivered":
      return "statusDelivered";

    case "cancelled":
      return "statusCancelled";

    default:
      return "statusPending";

  }

}


/* =========================================
   UTILITIES
========================================= */

function closeModal(id){

  const element =
    document.getElementById(id);

  if(element){

    element.style.display =
      "none";

  }

}


function formatDate(timestamp){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "Date unavailable";

  }


  return timestamp
    .toDate()
    .toLocaleString("en-IN");

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
