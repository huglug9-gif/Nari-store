<body>

<input
id="email"
type="email"

<input
id="password"

placeholder="Password"

</p>

id="imageFile"
type="file"
accept="image/*"

<img

class="imagePreview"

id="progressBox"

<div

class="uploadStatus"

<script>

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig={

apiKey:
"AIzaSyAqyKD4uqDvEy7n_pnGrpY02C-NToqVRb8",

authDomain:
"nari-fashion-947a7.firebaseapp.com",

projectId:
"nari-fashion-947a7",

storageBucket:
"nari-fashion-947a7.firebasestorage.app",

messagingSenderId:
"529668256601",

appId:
"1:529668256601:web:b3cc39c8ea7c783133d248"

};


/* =========================
   ADMIN UID
========================= */

const ADMIN_UID=
"GJXt6XRE6hgPtAKeNyNjcnBbjsZ2";


/* =========================
   FIREBASE
========================= */

firebase.initializeApp(firebaseConfig);

const auth=
firebase.auth();

const db=
firebase.firestore();

const storage=
firebase.storage();


/* =========================
   HELPERS
========================= */

const $=id=>
document.getElementById(id);


let products=[];

let selectedImageFile=null;


/* =========================
   LOGIN
========================= */

$("loginBtn").addEventListener(
"click",
async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;


if(!email||!password){

$("loginMsg").textContent=
"Email aur password bharo.";

return;

}


$("loginBtn").disabled=true;

$("loginBtn").textContent=
"Logging in...";

$("loginMsg").textContent="";


try{

await auth
.signInWithEmailAndPassword(
email,
password
);

}catch(e){

console.error(e);

$("loginMsg").textContent=
"Login failed: "
+(e.code||e.message);

}finally{

$("loginBtn").disabled=false;

$("loginBtn").textContent=
"Login";

}

});


/* =========================
   LOGOUT
========================= */

$("logout").onclick=()=>{

auth.signOut();

};


/* =========================
   AUTH CHECK
========================= */

auth.onAuthStateChanged(
async user=>{

if(
user &&
user.uid===ADMIN_UID
){

$("login")
.classList.add("hidden");

$("panel")
.classList.remove("hidden");

await load();

}

else if(user){

$("loginMsg").textContent=
"This account is not the admin account.";

await auth.signOut();

}

else{

$("login")
.classList.remove("hidden");

$("panel")
.classList.add("hidden");

}

});


/* =========================
   LOAD EVERYTHING
========================= */

async function load(){

await loadProducts();

await loadOrders();

await loadComplaints();

await loadReviews();

}


/* =========================
   IMAGE SELECT
========================= */

$("imageFile").addEventListener(
"change",
event=>{

const file=
event.target.files[0];

selectedImageFile=
file||null;


$("progressBox").style.display=
"none";

$("progressBar").style.width=
"0%";


if(!file){

$("imagePreview").style.display=
"none";

$("uploadStatus").textContent="";

return;

}


/* CHECK IMAGE TYPE */

if(!file.type.startsWith("image/")){

$("uploadStatus").textContent=
"❌ Please image file select karein.";

selectedImageFile=null;

return;

}


/* CHECK 5MB */

if(file.size>5*1024*1024){

$("uploadStatus").textContent=
"❌ Image 5MB se chhoti honi chahiye.";

selectedImageFile=null;

return;

}


/* PREVIEW */

const reader=
new FileReader();

reader.onload=e=>{

$("imagePreview").src=
e.target.result;

$("imagePreview").style.display=
"block";

};

reader.readAsDataURL(file);


$("uploadStatus").textContent=
"✅ Image selected: "
+file.name
+" ("+
(file.size/1024/1024).toFixed(2)
+" MB)";

});


/* =========================
   COMPRESS IMAGE
========================= */

function compressImage(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=
event=>{

const img=
new Image();

img.onload=()=>{

const MAX_SIZE=1600;

let width=
img.width;

let height=
img.height;


/* RESIZE */

if(width>MAX_SIZE){

height=
Math.round(
height*MAX_SIZE/width
);

width=
MAX_SIZE;

}

if(height>MAX_SIZE){

width=
Math.round(
width*MAX_SIZE/height
);

height=
MAX_SIZE;

}


/* CANVAS */

const canvas=
document.createElement("canvas");

canvas.width=
width;

canvas.height=
height;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);


/* JPEG */

canvas.toBlob(
blob=>{

if(!blob){

reject(
new Error(
"Image compression failed."
)
);

return;

}


const newFile=
new File(
[blob],
"product_"+Date.now()+".jpg",
{
type:"image/jpeg",
lastModified:Date.now()
}
);


resolve(newFile);

},
"image/jpeg",
0.82
);

};


img.onerror=()=>{

reject(
new Error(
"Image read nahi ho pa rahi."
)
);

};


img.src=
event.target.result;

};


reader.onerror=()=>{

reject(
new Error(
"Image file read nahi ho pa rahi."
)
);

};


reader.readAsDataURL(file);

});

}


/* =========================
   UPLOAD IMAGE - FIXED
========================= */

async function uploadImage(file){

if(!file){

return null;

}


try{

$("uploadStatus").textContent=
"⏳ Image compress ho rahi hai...";


const compressedFile=
await compressImage(file);


$("uploadStatus").textContent=
"⏳ Image upload ho rahi hai...";


const safeName=
file.name
.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const path=
"products/"
+Date.now()
+"_"+safeName;


const ref=
storage
.ref()
.child(path);


/* SHOW PROGRESS */

$("progressBox").style.display=
"block";

$("progressBar").style.width=
"0%";


const uploadTask=
ref.put(compressedFile);


/* TIMEOUT */

const timeout=
setTimeout(()=>{

try{

uploadTask.cancel();

}catch(e){

console.error(e);

}

},60000);


/* WAIT FOR UPLOAD */

const url=
await new Promise(
(resolve,reject)=>{

uploadTask.on(

firebase.storage.TaskEvent.STATE_CHANGED,

snapshot=>{

const percent=
Math.round(
(
snapshot.bytesTransferred /
snapshot.totalBytes
)*100
);


$("progressBar").style.width=
percent+"%";


$("uploadStatus").textContent=
"⏳ Image upload ho rahi hai... "
+percent+"%";

},


error=>{

clearTimeout(timeout);

reject(error);

},


async()=>{

clearTimeout(timeout);

try{

const downloadURL=
await uploadTask
.snapshot
.ref
.getDownloadURL();


resolve(downloadURL);

}catch(error){

reject(error);

}

}

);

});


$("progressBar").style.width=
"100%";


$("uploadStatus").textContent=
"✅ Image uploaded successfully";


return url;


}catch(error){

console.error(
"IMAGE UPLOAD ERROR:",
error
);


let message=
error.message||
"Image upload failed.";


if(
error.code===
"storage/unauthorized"
){

message=
"❌ Firebase Storage permission denied.";

}

else if(
error.code===
"storage/canceled"
){

message=
"❌ Image upload timeout/cancelled.";

}

else if(
error.code===
"storage/unknown"
){

message=
"❌ Firebase Storage error.";

}


$("uploadStatus").textContent=
message;


throw error;

}

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

try{

const snapshot=
await db
.collection("products")
.get();


products=
snapshot.docs.map(doc=>({

id:doc.id,
...doc.data()

}));


$("pCount").textContent=
products.length;


$("productList").innerHTML=

products.map(p=>{

const sizes=
Array.isArray(p.sizes)
?p.sizes.join(", ")
:(p.sizes||"");


const inchSizes=
Array.isArray(p.inchSizes)
?p.inchSizes.join(", ")
:(p.inchSizes||"");


return `

<div class="item">

<div>

<img
src="${
p.image||
"https://placehold.co/100"
}"
style="
width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
"
>

<b>
${esc(p.name)}
</b>

<div>

₹${Number(p.price||0)
.toLocaleString("en-IN")}

•

Stock
${Number(p.stock||0)}

</div>

<div class="productSizes">

${
sizes
?"Sizes: "+esc(sizes)
:""
}

${
inchSizes
?" | Inch: "+esc(inchSizes)
:""
}

</div>

</div>


<div class="actions">

<button
onclick="editProduct('${p.id}')"
>
Edit
</button>


<button
class="danger"
onclick="deleteProduct('${p.id}')"
>
Delete
</button>

</div>

</div>

`;

}).join("")

||"<p>No products.</p>";


}catch(e){

console.error(e);

$("productList").innerHTML=
"<p>Products load nahi hue: "
+esc(e.message)
+"</p>";

}

}


/* =========================
   SAVE PRODUCT
========================= */

$("save").onclick=
async()=>{

const name=
$("name").value.trim();

const price=
Number($("price").value);

const stock=
Number($("stock").value);


if(!name){

$("msg").textContent=
"Product name required.";

return;

}


if(stock<0){

$("msg").textContent=
"Stock 0 se kam nahi ho sakta.";

return;

}


let imageUrl=
$("image").value.trim();


$("save").disabled=true;

$("save").textContent=
"Saving...";

$("msg").textContent=
"";


try{

/* IMAGE UPLOAD */

if(selectedImageFile){

$("msg").textContent=
"⏳ Image upload ho rahi hai...";


const uploaded=
await uploadImage(
selectedImageFile
);


if(!uploaded){

throw new Error(
"Image upload se URL nahi mila."
);

}


imageUrl=
uploaded;

}


/* SIZES */

const sizes=
$("sizes").value
.split(",")
.map(x=>x.trim())
.filter(Boolean);


/* INCH SIZES */

const inchSizes=
$("inchSizes").value
.split(",")
.map(x=>x.trim())
.filter(Boolean);


/* DATA */

const data={

name:name,

price:price,

stock:stock,

image:imageUrl,

sizes:sizes,

inchSizes:inchSizes,

updatedAt:
firebase.firestore
.FieldValue
.serverTimestamp()

};


/* UPDATE */

if($("pid").value){

$("msg").textContent=
"⏳ Product update ho raha hai...";


await db
.collection("products")
.doc($("pid").value)
.update(data);

}


/* ADD */

else{

$("msg").textContent=
"⏳ Product save ho raha hai...";


await db
.collection("products")
.add({

...data,

createdAt:
firebase.firestore
.FieldValue
.serverTimestamp()

});

}


$("msg").textContent=
"✅ Product saved successfully!";


clearForm();

await loadProducts();


}catch(e){

console.error(
"SAVE PRODUCT ERROR:",
e
);


$("msg").textContent=
"❌ Save failed: "
+(e.message||e.code||"Unknown error");


}finally{

$("save").disabled=false;

$("save").textContent=
"Save Product";

}

};


/* =========================
   CLEAR FORM
========================= */

$("clear").onclick=
clearForm;


function clearForm(){

$("pid").value="";

$("name").value="";

$("price").value="";

$("stock").value="";

$("image").value="";

$("sizes").value="";

$("inchSizes").value="";

$("imageFile").value="";

$("imagePreview").src="";

$("imagePreview").style.display=
"none";

$("uploadStatus").textContent="";

$("progressBox").style.display=
"none";

$("progressBar").style.width=
"0%";

$("msg").textContent="";

selectedImageFile=null;

}


/* =========================
   EDIT PRODUCT
========================= */

window.editProduct=
id=>{

const p=
products.find(x=>x.id===id);

if(!p)return;


$("pid").value=id;

$("name").value=
p.name||"";

$("price").value=
p.price||0;

$("stock").value=
p.stock||0;

$("image").value=
p.image||"";


$("sizes").value=
Array.isArray(p.sizes)
?p.sizes.join(",")
:(p.sizes||"");


$("inchSizes").value=
Array.isArray(p.inchSizes)
?p.inchSizes.join(",")
:(p.inchSizes||"");


if(p.image){

$("imagePreview").src=
p.image;

$("imagePreview").style.display=
"block";

}


selectedImageFile=null;

scrollTo(0,0);

};


/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct=
async id=>{

if(!confirm(
"Delete product?"
))return;


try{

await db
.collection("products")
.doc(id)
.delete();


await loadProducts();

}catch(e){

alert(
"Delete failed: "
+e.message
);

}

};


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

try{

const snapshot=
await db
.collection("orders")
.orderBy(
"createdAt",
"desc"
)
.get();


$("oCount").textContent=
snapshot.size;


$("orders").innerHTML=

snapshot.docs.map(doc=>{

const o=
doc.data();

const status=
(o.status||"pending")
.toLowerCase();


const items=
(o.items||[])
.map(i=>
esc(i.name)
+" × "
+i.qty
+(i.size
?" ("+esc(i.size)+")"
:"")
)
.join(", ");


let locationButton="";


if(
o.location &&
o.location.mapsUrl
){

locationButton=`

<a
href="${esc(o.location.mapsUrl)}"
target="_blank"
class="mapBtn"
style="
display:inline-block;
padding:8px 12px;
border-radius:7px;
text-decoration:none;
margin-top:8px;
background:#0d6efd;
color:white;
"
>
📍 View Location
</a>

`;

}


return `

<div class="order">

<b>
${esc(o.customerName||"")}
</b>

• ${esc(o.customerPhone||"")}

<br><br>

<strong>
Order ID:
</strong>

${esc(o.orderId||doc.id)}

<br>

${esc(o.address||"")}

<br><br>

<b>
₹${Number(o.total||0)
.toLocaleString("en-IN")}
</b>

<br>

<span class="statusBadge">
Status: ${esc(status)}
</span>

<br><br>

<small>
${items}
</small>

<br>

${locationButton}


<div class="orderButtons">

${
status!=="delivered"

?

`<button
class="deliveredBtn"
onclick="markDelivered('${doc.id}')"
>
✅ Mark Delivered
</button>`

:

`<button
class="deleteOrderBtn"
onclick="deleteOrder('${doc.id}')"
>
🗑️ Delete Order
</button>`

}

</div>

</div>

`;

}).join("")

||"<p>No orders.</p>";


}catch(e){

console.error(e);

$("orders").innerHTML=
"<p>Orders load nahi hue: "
+esc(e.message)
+"</p>";

}

}


/* =========================
   MARK DELIVERED
========================= */

window.markDelivered=
async id=>{

if(!confirm(
"Is order ko Delivered mark karein?"
))return;


try{

await db
.collection("orders")
.doc(id)
.update({

status:"delivered",

deliveredAt:
firebase.firestore
.FieldValue
.serverTimestamp()

});


await loadOrders();

}catch(e){

alert(
"Status update failed: "
+e.message
);

}

};


/* =========================
   DELETE DELIVERED ORDER
========================= */

window.deleteOrder=
async id=>{

if(!confirm(
"Delivered order ko permanently delete karein?"
))return;


try{

await db
.collection("orders")
.doc(id)
.delete();


await loadOrders();

}catch(e){

alert(
"Order delete failed: "
+e.message
);

}

};


/* =========================
   LOAD COMPLAINTS
========================= */

async function loadComplaints(){

try{

const snapshot=
await db
.collection("supportTickets")
.orderBy(
"createdAt",
"desc"
)
.get();


$("cCount").textContent=
snapshot.size;


$("complaints").innerHTML=

snapshot.docs.map(doc=>{

const c=
doc.data();


return `

<div class="complaint">

<b>
🆘 ${esc(c.problemType||"Problem")}
</b>

<br><br>

<strong>
Order ID:
</strong>

${esc(c.orderId||"")}

<br>

<strong>
Mobile:
</strong>

/* =========================
   UPDATE COMPLAINT
========================= */

window.updateComplaint=
async(id,status)=>{

try{

await db
.collection("supportTickets")
.doc(id)
.update({

status:status,

updatedAt:
firebase.firestore
.FieldValue
.serverTimestamp()

});


await loadComplaints();

}catch(e){

alert(e.message);

}

};


/* =========================
   DELETE COMPLAINT
========================= */

window.deleteComplaint=
async id=>{

if(!confirm(
"Complaint delete karein?"
))return;


try{

await db
.collection("supportTickets")
.doc(id)
.delete();


await loadComplaints();

}catch(e){

alert(e.message);

}

};


/* =========================
   LOAD REVIEWS
========================= */

async function loadReviews(){

try{

const snapshot=
await db
.collection("reviews")
.orderBy(
"createdAt",
"desc"
)
.get();


$("rCount").textContent=
snapshot.size;


$("reviews").innerHTML=

snapshot.docs.map(doc=>{

const r=
doc.data();


const rating=
Math.max(
0,
Math.min(
5,
Number(r.rating||0)
)
);


const stars=
"★".repeat(rating)
+
"☆".repeat(5-rating);


return `

<div class="review">

<b>
${esc(r.productName||"Product")}
</b>

<div class="starRating">
${stars}
</div>

<p>
${esc(r.review||r.comment||"")}
</p>

<small>
Order: ${esc(r.orderId||"")}
</small>

<br>

<button
class="deleteComplaintBtn"
style="margin-top:10px"
onclick="deleteReview('${doc.id}')"
>
Delete Review
</button>

</div>

`;

}).join("")

||"<p>No reviews yet.</p>";


}catch(e){

console.error(e);

$("reviews").innerHTML=
"<p>No reviews yet.</p>";

}

}


/* =========================
   DELETE REVIEW
========================= */

window.deleteReview=
async id=>{

if(!confirm(
"Review delete karein?"
))return;


try{

await db
.collection("reviews")
.doc(id)
.delete();


await loadReviews();

}catch(e){

alert(e.message);

}

};


/* =========================
   SECURITY ESCAPE
========================= */

function esc(s){

return String(s??"")
.replace(
/[&<>"']/g,

c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c])

);

}
