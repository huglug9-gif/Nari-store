<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NARI FASHION Admin</title><link rel="stylesheet" href="admin.css"></head><body><div id="login" class="box"><h1>NARI FASHION</h1><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginMsg"></p></div><div id="panel" class="hidden"><header><b>Admin Dashboard</b><button id="logout">Logout</button></header><main><section class="stats"><div>Products <b id="pCount">0</b></div><div>Orders <b id="oCount">0</b></div></section><section class="form"><h2>Add / Edit Product</h2><input id="pid" type="hidden"><input id="name" placeholder="Product name"><input id="price" type="number" placeholder="Price"><input id="stock" type="number" placeholder="Stock"><input id="image" placeholder="Image URL"><button id="save">Save Product</button><button id="clear" class="secondary">Clear</button><p id="msg"></p></section><section><h2>Products</h2><div id="productList"></div></section><section><h2>Orders</h2><div id="orders"></div></section></main></div><script type="module" src="admin.js"></script></body></html>
