/* ================================

function $(id){
  return document.getElementById(id);
}


function showMessage(id,text,type){

  const el=$(id);

  el.textContent=text;

  el.className=
    "message "+
    (type==="error"?"error":"success");

  el.style.display="block";

  setTimeout(()=>{
    el.style.display="none";
  },5000);
}


/* ================================
   LOGIN
================================ */

async function login(){

  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  if(!email || !password){

    showMessage(
      "loginMessage",
      "Email aur password enter karo.",
      "error"
    );

    return;
  }

  try{

    const result=
      await auth.signInWithEmailAndPassword(
        email,
        password
      );

    if(result.user.uid!==ADMIN_UID){

      await auth.signOut();

      throw new Error(
        "Ye account admin nahi hai."
      );
    }

  }catch(error){

    console.error(error);

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );
  }
}


async function logout(){

  await auth.signOut();

}

/* ================================

================================ */

function showTab(id,button){

  document
    .querySelectorAll(".section")
    .forEach(x=>{
      x.classList.remove("active");
    });

  document
    .querySelectorAll(".tabs button")
    .forEach(x=>{
      x.classList.remove("active");
    });

  $(id).classList.add("active");

  button.classList.add("active");

}


/* ================================
   IMAGE COMPRESSION
================================ */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=e=>{

      const img=new Image();

      img.onload=()=>{

        const maxSize=1600;

        let width=img.width;
        let height=img.height;

        if(width>height){

          if(width>maxSize){

            height=
              height*maxSize/width;

            width=maxSize;
          }

        }else{

          if(height>maxSize){

            width=
              width*maxSize/height;

            height=maxSize;
          }
        }

        const canvas=
          document.createElement("canvas");

        canvas.width=width;
        canvas.height=height;

        const ctx=
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(
          blob=>{
            resolve(
              new File(
                [blob],
                "product.jpg",
                {
                  type:"image/jpeg"
                }
              )
            );
          },
          "image/jpeg",
          0.82
        );

      };

      img.onerror=reject;

      img.src=e.target.result;
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}


/* ================================
   CLOUDINARY UPLOAD
================================ */

async function uploadImage(file){

  if(!file){
    return null;
  }

  try{

    $("uploadStatus").textContent=
      "⏳ Image compress ho rahi hai...";

    const compressedFile=
      await compressImage(file);

    $("uploadStatus").textContent=
      "⏳ Cloudinary par image upload ho rahi hai...";

    $("progressBox")
      .style.display="block";

    $("progressBar")
      .style.width="20%";


    const formData=new FormData();

    formData.append(
      "file",
      compressedFile
    );

    formData.append(
      "upload_preset",
      CLOUDINARY_UPLOAD_PRESET
    );


    $("progressBar")
      .style.width="40%";


    const response=
      await fetch(
        CLOUDINARY_UPLOAD_URL,
        {
          method:"POST",
          body:formData
        }
      );


    $("progressBar")
      .style.width="80%";


    if(!response.ok){

      const errorText=
        await response.text();

      throw new Error(
        "Cloudinary upload failed: "+
        errorText
      );
    }


    const result=
      await response.json();


    if(!result.secure_url){

      throw new Error(
        "Cloudinary URL nahi mila."
      );
    }


    $("progressBar")
      .style.width="100%";

    $("uploadStatus").textContent=
      "✅ Image uploaded successfully";


    return result.secure_url;


  }catch(error){

    console.error(
      "CLOUDINARY ERROR:",
      error
    );

    $("uploadStatus").textContent=
      "❌ Image upload failed: "+
      error.message;

    throw error;
  }

}


/* ================================
   IMAGE PREVIEW
================================ */

$("productImage")
.addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file){
      return;
    }

    const preview=
      $("imagePreview");

    preview.src=
      URL.createObjectURL(file);

    preview.style.display="block";

  }
);


/* ================================
   SAVE PRODUCT
================================ */

async function saveProduct(){

  const name=
    $("productName").value.trim();

  const price=
    Number($("productPrice").value);

  const stock=
    Number($("productStock").value);

  const sizes=
    $("productSizes").value.trim();

  const inchSizes=
    $("productInchSizes").value.trim();

  let imageUrl=
    $("productImageUrl").value.trim();

  const file=
    $("productImage").files[0];

  const editId=
    $("editProductId").value;


  if(!name){

    alert("Product name enter karo.");
    return;
  }

  if(!price){

    alert("Price enter karo.");
    return;
  }


  try{

    /* Upload image if selected */

    if(file){

      imageUrl=
        await uploadImage(file);
    }


    if(!imageUrl){

      alert(
        "Image URL ya image file do."
      );

      return;
    }


    const productData={

      name:name,

      price:price,

      stock:stock,

      image:imageUrl,

      sizes:sizes,

      inchSizes:inchSizes,

      updatedAt:
        firebase.firestore
        .FieldValue
        .serverTimestamp()

    };


    if(editId){

      await db
        .collection("products")
        .doc(editId)
        .update(productData);

      alert(
        "✅ Product updated successfully!"
      );

    }else{

      productData.createdAt=
        firebase.firestore
        .FieldValue
        .serverTimestamp();

      await db
        .collection("products")
        .add(productData);

      alert(
        "✅ Product added successfully!"
      );
    }


    resetProductForm();

    await loadProducts();


  }catch(error){

    console.error(error);

    alert(
      "❌ Product save failed:\n"+
      error.message
    );
  }

}


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

  const box=
    $("productList");

  box.innerHTML=
    "⏳ Loading products...";


  try{

    const snapshot=
      await db
        .collection("products")
        .orderBy(
          "createdAt",
          "desc"
        )
        .get();


    $("statProducts").textContent=
      snapshot.size;


    if(snapshot.empty){

      box.innerHTML=
        "<p>No products added yet.</p>";

      return;
    }


    box.innerHTML="";


    snapshot.forEach(doc=>{

      const p=doc.data();

      const div=
        document.createElement("div");

      div.className="product";


      div.innerHTML=`

        <img
          src="${p.image || ""}"
          onerror="this.style.display='none'"
        >

        <div class="productInfo">

          <h3>
            ${escapeHtml(p.name || "Unnamed")}
          </h3>

          <p>
            ₹${Number(p.price || 0)}
          </p>

          <p class="small">
            Stock: ${p.stock ?? 0}
          </p>

          <p class="small">
            Sizes:
            ${escapeHtml(p.sizes || "-")}
          </p>

          <div class="actions">

            <button
              class="blue"
              onclick="editProduct('${doc.id}')"
            >
              ✏️ Edit
            </button>

            <button
              class="red"
              onclick="deleteProduct('${doc.id}')"
            >
              🗑️ Delete
            </button>

          </div>

        </div>
      `;


      box.appendChild(div);

    });


  }catch(error){

    console.error(error);

    box.innerHTML=
      "❌ Products load nahi hue.";

  }

}


/* ================================
   EDIT PRODUCT
================================ */

async function editProduct(id){

  try{

    const doc=
      await db
        .collection("products")
        .doc(id)
        .get();

    if(!doc.exists){

      alert("Product nahi mila.");

      return;
    }

    const p=doc.data();


    $("editProductId").value=id;

    $("productName").value=
      p.name || "";

    $("productPrice").value=
      p.price || "";

    $("productStock").value=
      p.stock || "";

    $("productSizes").value=
      p.sizes || "";

    $("productInchSizes").value=
      p.inchSizes || "";

    $("productImageUrl").value=
      p.image || "";


    $("formTitle").textContent=
      "✏️ Edit Product";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


  }catch(error){

    alert(error.message);

  }

}


/* ================================
   DELETE PRODUCT
================================ */

async function deleteProduct(id){

  if(!confirm(
    "Kya tum ye product delete karna chahte ho?"
  )){
    return;
  }


  try{

    await db
      .collection("products")
      .doc(id)
      .delete();


    alert(
      "✅ Product deleted."
    );

    await loadProducts();


  }catch(error){

    alert(
      "❌ Delete failed:\n"+
      error.message
    );

  }

}


/* ================================
   RESET PRODUCT FORM
================================ */

function resetProductForm(){

  $("editProductId").value="";

  $("productName").value="";

  $("productPrice").value="";

  $("productStock").value="";

  $("productSizes").value="";

  $("productInchSizes").value="";

  $("productImageUrl").value="";

  $("productImage").value="";

  $("imagePreview").style.display="none";

  $("uploadStatus").textContent="";

  $("progressBox").style.display="none";

/* ================================
   LOAD ORDERS
================================ */

async function loadOrders(){

  const box=
    $("orderList");

  box.innerHTML=
    "⏳ Loading orders...";


  try{

    const snapshot=
      await db
        .collection("orders")
        .orderBy(
          "createdAt",
          "desc"
        )
        .get();


    $("statOrders").textContent=
      snapshot.size;


    let pending=0;
    let cancelled=0;


    snapshot.forEach(doc=>{

      const o=doc.data();

      if(o.status==="pending"){
        pending++;
      }

      if(o.status==="cancelled"){
        cancelled++;
      }

    });


    $("statPending").textContent=
      pending;

    $("statCancelled").textContent=
      cancelled;


    if(snapshot.empty){

      box.innerHTML=
        "<p>No orders yet.</p>";

      return;
    }


    box.innerHTML="";


    snapshot.forEach(doc=>{

      const o=doc.data();

      const status=
        o.status || "pending";


      let created="";

      if(o.createdAt){

        try{

          created=
            o.createdAt
              .toDate()
              .toLocaleString(
                "en-IN"
              );

        }catch(e){}

      }


      let itemsHTML="";


      if(Array.isArray(o.items)){

        o.items.forEach(item=>{

          itemsHTML+=`

            <div class="itemLine">

              <span>
                ${escapeHtml(
                  item.name || "Product"
                )}

                × ${item.qty || 1}

                ${
                  item.size
                    ? " — Size: "+
                      escapeHtml(item.size)
                    : ""
                }

              </span>

              <b>
                ₹${
                  Number(item.price || 0) *
                  Number(item.qty || 1)
                }
              </b>

            </div>

          `;

        });

      }


      const address=`

        ${escapeHtml(
          o.house || ""
        )}<br>

        ${escapeHtml(
          o.street || ""
        )}<br>

        ${
          o.landmark
            ? escapeHtml(o.landmark)+"<br>"
            : ""
        }

        ${escapeHtml(
          o.city || ""
        )},

        ${escapeHtml(
          o.state || ""
        )}

        -

        ${escapeHtml(
          o.pin || ""
        )}

      `;


      let cancelInfo="";

      if(status==="cancelled"){

        cancelInfo=`

          <p style="
            color:#b91c1c;
            font-weight:bold;
            margin-top:8px;
          ">
            ❌ Cancelled
            ${
              o.cancelledBy
                ? "by "+
                  escapeHtml(
                    o.cancelledBy
                  )
                : ""
            }
          </p>

        `;

      }


      const div=
        document.createElement("div");

      div.className="order";


      div.innerHTML=`

        <div class="orderHead">

          <div>

            <b>
              Order ID:
              ${escapeHtml(
                o.orderId || doc.id
              )}
            </b>

            <p class="small">
              ${created}
            </p>

          </div>

          <span class="
            status
            ${status}
          ">
            ${status.toUpperCase()}
          </span>

        </div>


        ${cancelInfo}


        <hr style="
          margin:12px 0;
          border:0;
          border-top:1px solid #ddd;
        ">


        <p>
          <b>Customer:</b>
          ${escapeHtml(
            o.customerName || "-"
          )}
        </p>

        <p>
          <b>Mobile:</b>
          ${escapeHtml(
            o.customerPhone || "-"
          )}
        </p>


        <div
          class="orderItems"
        >

          <b>Items</b>

          ${itemsHTML}

          <div style="
            display:flex;
            justify-content:space-between;
            margin-top:12px;
            font-size:18px;
          ">

            <b>Total</b>

            <b>
              ₹${Number(o.total || 0)}
            </b>

          </div>

        </div>


        <p>
          <b>Delivery Address:</b>
        </p>

        <p class="small">
          ${address}
        </p>


        ${
          o.note
            ? `
              <p class="small">
                <b>Note:</b>
                ${escapeHtml(o.note)}
              </p>
            `
            : ""
        }


        <div class="actions">

          ${
            status==="pending"
              ? `
                <button
                  class="blue"
                  onclick="
                    updateOrderStatus(
                      '${doc.id}',
                      'processing'
                    )
                  "
                >
                  ⚙️ Processing
                </button>
              `
              : ""
          }


          ${
            status==="processing"
              ? `
                <button
                  class="green"
                  onclick="
                    updateOrderStatus(
                      '${doc.id}',
                      'delivered'
                    )
                  "
                >
                  🚚 Mark Delivered
                </button>
              `
              : ""
          }


          ${
            status==="cancelled"
              ? `
                <button
                  class="gray"
                  disabled
                >
                  ❌ Cancelled
                </button>
              `
              : ""
          }


          <button
            class="red"
            onclick="
              deleteOrder(
                '${doc.id}'
              )
            "
          >
            🗑️ Delete
          </button>

        </div>

      `;


      box.appendChild(div);

    });


  }catch(error){

    console.error(error);

    box.innerHTML=
      `
        <p style="color:red">
          ❌ Orders load failed:<br>
          ${escapeHtml(error.message)}
        </p>
      `;

  }

}


/* ================================
   UPDATE ORDER STATUS
================================ */

window.updateOrderStatus=
async function(id,status){

  try{

    await db
      .collection("orders")
      .doc(id)
      .update({

        status:status,

        updatedAt:
          firebase.firestore
          .FieldValue
          .serverTimestamp()

      });


    alert(
      "✅ Order status updated."
    );


    await loadOrders();


  }catch(error){

    alert(
      "❌ Status update failed:\n"+
      error.message
    );

  }

};


/* ================================
   DELETE ORDER
================================ */

async function deleteOrder(id){

  if(!confirm(
    "Kya tum ye order permanently delete karna chahte ho?"
  )){
    return;
  }


  try{

    await db
      .collection("orders")
      .doc(id)
      .delete();


    alert(
      "✅ Order deleted."
    );


    await loadOrders();


  }catch(error){

    alert(
      "❌ Order delete failed:\n"+
      error.message
    );

  }

}

/* ================================
   HTML ESCAPE
================================ */

function escapeHtml(value){

  if(value===null ||
     value===undefined){

    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
